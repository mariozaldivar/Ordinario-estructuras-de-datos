<!doctype html>
<link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
<!-- [EQUIPO] Página escrita por el equipo. Solo las partes marcadas con [IA] se agregaron con inteligencia artificial. -->
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador</title>

    <link rel="stylesheet" href="styles.css">
    <!-- [IA] inicio: estilos del panel "Ver código" (documentación). -->
    <link rel="stylesheet" href="../visor/panel.css">
    <!-- [IA] fin -->
  </head>

  <body>
    <div class="content">
    <h1>¡Navega en el internet!</h1>
    <div id="">
    </div>

        <p id ="currentPage">Pagina actual:</p>
        <div class ="searchBar">
        <input
          type="text"
          id="url"
          step="1"
          placeholder=""
        ></input>
        <button id="buscar">Buscar</button>
      </div>

      
      <div class="buttonContainer"> 
        <button id="retroceder">Retroceder</button>
        <button id="avanzar">Avanzar</button>
        <button id="exit">Exit</button>
      </div>

      <div class="pageContainer">
        <div class="layoutSiguientes">
        <p>Páginas siguientes:</p>
        <ul id="visitados" class="visitados"> </ul>
      </div>

      <div class= "layoutAnteriores">
        <p>Páginas anteriores</p>
        <ul id="retrocedidos" class="retrocedidos"> </ul>  
      </div>
    </div>

    <!-- [IA] inicio: botón y panel "Ver código" con la documentación del proyecto. -->
    <div class="verCodigo" style="margin-top: 32px">
      <button type="button" class="ver-codigo" data-ver-codigo="CODIGO.md" data-titulo="Navegador web">Ver código</button>
    </div>
    <!-- [IA] fin -->

    <script src="buscador.js"></script>
    <!-- [IA] inicio: intérprete de Markdown y panel de documentación. -->
    <script src="../visor/markdown.js"></script>
    <script src="../visor/panel.js"></script>
    <!-- [IA] fin -->
  </body>
</html>
