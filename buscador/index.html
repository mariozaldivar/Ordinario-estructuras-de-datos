<!doctype html>
<link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador</title>

    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <div class="content">
    <h1>¡Navega en el internet!</h1>
    <div id="">
    </div>

        <p id ="currentPage">Pagina actual:</p>
        <div class ="searchBar">
        <input
          type="text"
          id="url"
          step="1"
          placeholder=""
        ></input>
        <button id="buscar">Buscar</button>
      </div>

      
      <div class="buttonContainer"> 
        <button id="retroceder">Retroceder</button>
        <button id="avanzar">Avanzar</button>
        <button id="exit">Exit</button>
      </div>

      <div class="pageContainer">
        <div class="layoutSiguientes">
        <p>Páginas siguientes:</p>
        <ul id="visitados" class="visitados"> </ul>
      </div>

      <div class= "layoutAnteriores">
        <p>Páginas anteriores</p>
        <ul id="retrocedidos" class="retrocedidos"> </ul>  
      </div>
    </div>

    <script src="buscador.js"></script>
  </body>
</html>
