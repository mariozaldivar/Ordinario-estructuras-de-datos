<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor resistencias</title>

    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <div class="content">
    <h1>¡Convierte el valor en Ohms de tus resistencias a colores!</h1>
    <div>
      <div id="resistor">
        <div id="stripes">
          <div class="stripe" id="stripe_1"></div>
          <div class="stripe" id="stripe_2"></div>
          <div class="stripe" id="stripe_3"></div>
          <div class="stripe" id="stripe_4"></div>
        </div>
      </div>

      <input
        type="number"
        id="valor_resistencia"
        placeholder="Introduce el valor de la resistencia"
        step="1"
      ></input>



      <div class="resistences_container"></div>

</div>
</div>
    <script src="resistor.js"></script>
  </body>
</html>
