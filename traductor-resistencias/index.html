<!doctype html>
<link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor resistencias</title>

    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <div class="content">
    <h1>¡Convierte el valor en Ohms de tus resistencias a colores!</h1>
    <div id="current_resistence">
    </div>
    
      <input
        type="number"
        id="valor_resistencia"
        placeholder="Introduce el valor de la resistencia"
        step="1"
      ></input>
      <div class="button_container">
      <button id="add_to_circuit">Agregar resistencia al circuito</button>
      <button id="show_series">Mostrar circuito en serie</button>
      <button id="show_Paralel">Mostrar circuito en paralelo</button>
      </div>

      <div class="circuit" id="circuit">
        <p id="serie">Suma total de las resistencias de tu circuito en serie: </p>
        <p id="paralelo">Suma total de las resistencias de tu circuito en paralelo: </p>
          <div class="resistences_container">
          </div>
        </div>

    <script src="resistor.js"></script>
  </body>
</html>
